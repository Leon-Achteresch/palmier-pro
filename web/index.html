<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:;"
    />
    <script>
      // Installed before the bundle so Motion, React and any scene code capture the virtual clock.
      (() => {
        const EPOCH = 1735689600000
        let now = 0
        let queue = []
        let nextId = 1
        let seed = 0x9e3779b9

        const RealDate = Date

        performance.now = () => now
        Math.random = () => {
          seed |= 0
          seed = (seed + 0x6d2b79f5) | 0
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }

        // Date must be virtual too: a scene printing the clock would otherwise bake differently every run.
        const VirtualDate = function (...args) {
          return args.length === 0 ? new RealDate(EPOCH + now) : new RealDate(...args)
        }
        VirtualDate.prototype = RealDate.prototype
        VirtualDate.now = () => EPOCH + now
        VirtualDate.parse = RealDate.parse
        VirtualDate.UTC = RealDate.UTC
        window.Date = VirtualDate

        window.requestAnimationFrame = (cb) => {
          const id = nextId++
          queue.push([id, cb])
          return id
        }
        window.cancelAnimationFrame = (id) => {
          queue = queue.filter((e) => e[0] !== id)
        }

        window.__clock = {
          seedRandom(value) {
            seed = value | 0 || 0x9e3779b9
          },
          set(ms) {
            now = ms
          },
          now: () => now,
          // ponytail: one flush per seek — correct for sequential baking, where each rAF chain
          // advances exactly one step per frame. Random-access seeking of rAF-driven scenes would
          // need a replay from zero; add that only if scrubbing ever needs it.
          flush() {
            const due = queue
            queue = []
            for (const [, cb] of due) {
              try {
                cb(now)
              } catch (error) {
                window.__recordError?.(error)
              }
            }
            return due.length
          },
        }
      })()
    </script>
    <style id="tw"></style>
  </head>
  <body>
    <div id="scene"></div>
    <script type="module" src="/src/runtime.tsx"></script>
  </body>
</html>
